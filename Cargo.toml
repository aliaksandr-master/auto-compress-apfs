[package]
name = "auto-compress-apfs"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Turns on APFS transparent compression for files matched by glob patterns, using /usr/bin/ditto or an in-process LZFSE backend"
license = "GPL-3.0-or-later"
authors = ["Aliaksandr Master <alxe.master@gmail.com>"]
readme = "README.md"
keywords = ["apfs", "compression", "macos", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem", "compression"]
repository = "https://github.com/aliaksandr-master/auto-compress-apfs"
homepage = "https://github.com/aliaksandr-master/auto-compress-apfs"
include = ["/src", "/config/default.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/examples"]

[dependencies]
# In-process decmpfs writer (opt-in `backend = "applesauce"`); its lzfse-sys is pinned below.
applesauce-core = { version = "=0.4.14", default-features = false, features = ["lzfse", "lzvn"] }
# Content hashes of `dedup` candidates.
blake3 = "=1.8.7"
globset = "0.4"
libc = "0.2"
# Pinned: its version is part of the incompressible-cache record of the applesauce backend.
lzfse-sys = "=2.0.0"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
# Property tests; no fork/timeout features, every property is a pure function.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }



[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
let_underscore_drop = "deny"
unused_must_use = "deny"
dropping_references = "deny"
unconditional_recursion = "deny"
non_ascii_idents = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)", "cfg(fuzzing)", "cfg(kani)"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
mem_forget = "deny"

let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
declare_interior_mutable_const = "deny"
borrow_interior_mutable_const = "deny"
rc_mutex = "warn"
arc_with_non_send_sync = "deny"

redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
large_futures = "warn"
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
box_collection = "warn"
vec_box = "warn"
rc_buffer = "warn"
clone_on_ref_ptr = "warn"
format_collect = "warn"
string_add = "warn"
inline_always = "warn"

unwrap_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
panic_in_result_fn = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "warn"
bare_urls = "warn"
missing_crate_level_docs = "warn"

[profile.dev]
# Backtraces keep file:line, smaller link input.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies optimised once and cached: blake3 and lzfse dominate test time unoptimised.
opt-level = 1
debug = false

# `cargo install` builds this profile, so it stays the shipped one.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
# Not stripped: an endpoint security agent (static scan) quarantined the stripped release binary
# right after the build, while the same build with its symbol table kept was left alone.
strip = false

# What `make release` builds: the release profile under its own name (target/dist).
[profile.dist]
inherits = "release"
