# auto-compress-apfs configuration.
# Every key is optional; the values below are the built-in defaults.
# A leading `~` or `~/` in patterns, exclude, allow_volumes and log_dir expands to $HOME.

# Glob patterns of what to compress. `*`, `?`, `[...]` never cross `/`, `**` matches any number
# of directories, `{a,b}` is an alternation. A matched DIRECTORY means every regular file below
# it, recursively. Patterns must be absolute after `~` expansion.
# Empty by default: nothing is compressed until you add patterns here (or pass --search).
# Example: patterns = ["~/projects/**/.venv", "~/.cache/uv"]; more in examples/ of the source.
# `~/Downloads` is a privacy-protected (TCC) folder: the binary needs Full Disk Access (or
# Downloads access) in System Settings > Privacy & Security, otherwise the run logs one ERROR
# naming the binary to allow. Hypothesis: every rebuild produces a new ad-hoc signature, so
# macOS may ask for that permission again after it.
# Other protected folders (~/Desktop, ~/Documents, ~/Pictures, ~/Movies, ~/Music, ~/Library)
# are never entered unless a pattern's literal prefix lies inside them.
patterns = []

# Never descended into (directories) or compressed (files), inside matches as well.
# A pattern without `/` matches an entry NAME at any depth (`*.log`, `node_modules`).
# A pattern with `/` is a full-path glob (`~/projects/**/big-venv`); `X/**` also excludes X itself.
# Exclude always wins over a matching pattern. The default list skips already-compressed
# formats, archives and partial downloads.
exclude = [
    "node_modules",
    ".git",
    "target",
    "*.{xz,gz,tgz,zip,zst,bz2,lz4,lzma,txz,tbz2,tbz,whl,jar,xip,parquet,png,jpg,jpeg,7z,rar,dmg,mp4,mov,webp,heic,pkg}",
    "*.crdownload",
    "*.part",
    "*.download",
]

# Only the internal data volume (the one holding /System/Volumes/Data) is ever walked.
# Mount points listed here allow further LOCAL apfs volumes; network, cloud and non-apfs
# filesystems are refused even when listed. /Volumes, ~/Library/CloudStorage,
# ~/Library/Mobile Documents, /System, /dev, /Network and /net are never walked.
allow_volumes = []

# A compressed file found decompressed again (rewritten) on this many consecutive run days is
# added to quarantine.txt next to this config and never compressed again until released by
# hand. 0 disables the quarantine.
quarantine_after = 3

# Free space (bytes) that must remain after a batch's copies; batches that would go below are
# skipped. Default 10 GiB.
min_free_bytes = 10737418240

# Never cross into another mounted filesystem while searching.
one_file_system = true

# Worker threads for the walk and for ditto batches; 0 = number of CPUs.
threads = 0

# Maximum number of files per /usr/bin/ditto call.
batch_size = 1000

# How the compressed copy is checked: false = not compared (ditto only); true = its bytes as
# the kernel decompresses them are compared with the original before the swap; "extended" =
# also decodes its decmpfs data independently of the kernel and, after the swap, compares the
# file at the path with the original once more (a mismatch swaps the original back).
verify = "extended"

# Files modified less than this many seconds ago are skipped (they may still be written to).
min_age_secs = 300

# Log directory; the log is <log_dir>/auto-compress-apfs.log.
log_dir = "~/Library/Logs/auto-compress-apfs"

# Rotate the current log when it would grow beyond this many bytes (>= 65536).
log_max_bytes = 4194304

# Rotated logs kept (.log.1 .. .log.N, at most 9).
# log_max_bytes * (log_keep + 1) + 1 MiB must not exceed 10 MiB.
log_keep = 1

# Which backend compresses which file sizes (bytes, both bounds inclusive; no max_size =
# unbounded). A table list: keep it after every plain key. "ditto" runs /usr/bin/ditto
# --hfsCompression (the system's compressor); it leaves files of 16384 bytes or less and files
# over 512 MiB (536870912) uncompressed, so a ditto range must lie inside 16385..536870912 to
# be useful and may not go above 536870912. "applesauce" compresses in-process with LZFSE (the
# applesauce-core decmpfs writer) and always byte-compares the copy, even with verify = false;
# a file whose compressed form would exceed 4 GiB is cached as incompressible. Files below the
# lowest min_size are ignored; a file outside every range is skipped. Ranges must not overlap.
# `--backend` forces one backend for a run. Changing the ranges re-checks the files cached as
# incompressible once. Old configs: a top-level `min_size` alone sets ditto's lower bound of
# this default routing; a top-level `backend` means that backend alone for
# min_size..536870912. Neither may be combined with this table.
[[backend_by_size]]
backend = "ditto"
min_size = 16385
max_size = 536870912

[[backend_by_size]]
backend = "applesauce"
min_size = 536870913

# `trash` moves every file or directory matched by these patterns to ~/.Trash; `purge` deletes
# them for good. Same pattern and exclude syntax as above; a matched directory goes as a whole,
# whatever its age, unless an exclude matches something inside it (then it stays). Only items
# strictly below the home directory or an allow_volumes mount are acted on. Nothing happens without `--apply` (`trash --apply`,
# `purge --apply`). `run` says what the `run` command (which the launchd agent starts daily)
# does with a section: false = skipped, true = run (with --apply under `run --apply`),
# "dry-run-only" = always a preview, even under `run --apply`. Order: trash, purge, cargo-clean, compress,
# dedup, tm-exclude. Old configs: `scheduled = true|false` means `run = true|false` in [trash],
# [purge] and [tm_exclude]; a section may not hold both. Every item is written to
# <log_dir>/removed.tsv. Hard protections apply as for compress, and an item is refused when it
# is the home directory, a protected folder itself, an ancestor of either, is the config file or
# one of the tool's files next to it, lies in or holds the log, state or cache directory or the
# Trash, or holds a flagged (uchg/schg/...), a
# dataless (cloud) or a .acz-staging-/.acz-rescue- entry. Excludes match the spelling of the
# path as walked (and the on-disk spelling below a matched item), case-sensitively.
[trash]
patterns = []
exclude = []
run = false

[purge]
patterns = []
exclude = []
run = false

# `cargo-clean` finds Cargo projects by their Cargo.toml below `roots` (target, .git and
# node_modules are not entered) and reads it: the workspace root (a [workspace] manifest at or
# above it) gives `<workspace>/target`, unless `build.target-dir` of the nearest
# .cargo/config.toml (or ~/.cargo/config.toml) says otherwise; `build.build-dir` is cleaned as
# well. Only directories with Cargo's CACHEDIR.TAG are touched (a named one without it is a
# WARN). Target dirs no manifest names (CARGO_TARGET_DIR) are found by that tag: below the
# roots, and one or two levels below a found target (target/dev-stand/<name>). In a git
# worktree the stale final artifacts of every profile go, whatever keep_final_*. In each profile dir
# (debug, release, <triple>/<profile>) a build unit, `.fingerprint/<name>-<hash>` with
# `build/<name>-<hash>` and the `deps` entries of that hash, is deleted when none of them was
# modified (or a file read) for max_age_secs and no fresh unit was built against it (its
# .fingerprint JSON); `incremental` dirs by their own age. The final artifacts at the top of
# debug / release (and their examples) stay while keep_final_debug / keep_final_release are
# true; with false they go too once not used (modified or run) for max_age_secs. A profile
# whose Cargo lock a build holds is skipped; `exclude` also keeps whole profiles ("release"). Refusals, preview,
# `--apply` and the journal as for [purge]; `run` as for [trash].
[cargo_clean]
roots = []
exclude = []
max_age_secs = 2592000
keep_final_debug = true
keep_final_release = true
# true: every target/build dir found is also excluded from Time Machine (as tm-exclude does).
exclude_time_machine = false
run = false

# What `run` does with compress (the top-level patterns above); `run` as for [trash].
[compress]
run = true

# `dedup` replaces identical files below these patterns by APFS clones of one of them (copy on
# write: the files stay separate, their data is stored once). Only regular files of at least
# min_size bytes (>= 1) are compared, by size, then a BLAKE3 hash of their first and last
# 64 KiB, then of all their bytes. A file is kept as the reference: one already compressed
# first, else the oldest, else the first path. Another file is replaced only when its owner,
# group, mode, BSD flags (except compressed) and extended attributes (except
# com.apple.lastuseddate#PS) equal the reference's and neither has an ACL; the replaced file
# gets the clone's com.apple.provenance. Hardlinked, setuid/setgid, too new (min_age_secs),
# flagged, dataless and other users' files are never touched. The clone is byte-compared with the file before and after the swap. Nothing happens
# without `--apply` (`dedup --apply`); `run` as for [trash]. Time Machine local snapshots may
# keep the freed blocks until they expire.
[dedup]
patterns = []
exclude = [".git", "target", "node_modules"]
min_size = 1048576
run = false

# `tm-exclude` excludes every directory matched by these patterns from Time Machine backups by
# setting the sticky exclusion attribute that `tmutil addexclusion` sets (tmutil itself is never
# executed). Matched files are ignored; a directory matched inside another matched one is
# covered by it. An existing exclusion is never removed or changed. Undo one by hand with
# `tmutil removeexclusion <path>` or
# `xattr -d com.apple.metadata:com_apple_backup_excludeItem <path>`; every excluded path is an
# INFO line `excluded from Time Machine <path>` in the log. The same location checks as
# for trash/purge apply. Nothing happens without `--apply` (`tm-exclude --apply`);
# `run` as for [trash].
# Install a binary that knows this section before adding it to an existing config: older
# binaries reject unknown sections. An exclude may not lie inside a directory a pattern names
# (`.../node_modules/keep` with `**/node_modules`): the exclusion covers it anyway.
[tm_exclude]
patterns = [
  # "~/Work_*/**/target",
  # "~/Work_*/**/node_modules",
  # "~/Work_*/**/.venv",
  # "~/**/.claude/worktrees",
]
exclude = []
run = false
