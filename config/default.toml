# auto-compress-apfs configuration.
# Every key is optional; the values below are the built-in defaults.
# A leading `~` or `~/` in patterns, exclude, allow_volumes and log_dir expands to $HOME.

# Glob patterns of what to compress. `*`, `?`, `[...]` never cross `/`, `**` matches any number
# of directories, `{a,b}` is an alternation. A matched DIRECTORY means every regular file below
# it, recursively. Patterns must be absolute after `~` expansion.
# Empty by default: nothing is compressed until you add patterns here (or pass --search).
# Example: patterns = ["~/projects/**/.venv", "~/.cache/uv"]; more in examples/ of the source.
# `~/Downloads` is a privacy-protected (TCC) folder: the binary needs Full Disk Access (or
# Downloads access) in System Settings > Privacy & Security, otherwise the run logs one ERROR
# naming the binary to allow. Hypothesis: every rebuild produces a new ad-hoc signature, so
# macOS may ask for that permission again after it.
# Other protected folders (~/Desktop, ~/Documents, ~/Pictures, ~/Movies, ~/Music, ~/Library)
# are never entered unless a pattern's literal prefix lies inside them.
patterns = []

# Never descended into (directories) or compressed (files), inside matches as well.
# A pattern without `/` matches an entry NAME at any depth (`*.log`, `node_modules`).
# A pattern with `/` is a full-path glob (`~/projects/**/big-venv`); `X/**` also excludes X itself.
# Exclude always wins over a matching pattern. The default list skips already-compressed
# formats, archives and partial downloads.
exclude = [
    "node_modules",
    ".git",
    "target",
    "*.{xz,gz,tgz,zip,zst,bz2,lz4,lzma,txz,tbz2,tbz,whl,jar,xip,parquet,png,jpg,jpeg,7z,rar,dmg,mp4,mov,webp,heic,pkg}",
    "*.crdownload",
    "*.part",
    "*.download",
]

# Only the internal data volume (the one holding /System/Volumes/Data) is ever walked.
# Mount points listed here allow further LOCAL apfs volumes; network, cloud and non-apfs
# filesystems are refused even when listed. /Volumes, ~/Library/CloudStorage,
# ~/Library/Mobile Documents, /System, /dev, /Network and /net are never walked.
allow_volumes = []

# A compressed file found decompressed again (rewritten) on this many consecutive run days is
# added to quarantine.txt next to this config and never compressed again until released by
# hand. 0 disables the quarantine.
quarantine_after = 3

# Free space (bytes) that must remain after a batch's copies; batches that would go below are
# skipped. Default 10 GiB.
min_free_bytes = 10737418240

# Never cross into another mounted filesystem while searching.
one_file_system = true

# Worker threads for the walk and for ditto batches; 0 = number of CPUs.
threads = 0

# Maximum number of files per /usr/bin/ditto call.
batch_size = 1000

# Byte-compare the compressed copy with the original before replacing it.
verify = true

# How the compressed copy is made: "ditto" runs /usr/bin/ditto --hfsCompression (the system's
# compressor); "applesauce" compresses in-process with LZFSE (the applesauce-core decmpfs
# writer) and always byte-compares the copy, whatever `verify` says. Files over 512 MiB are
# skipped by both. `--backend` overrides this for one run.
backend = "ditto"

# Files smaller than this (bytes) are ignored. ditto --hfsCompression leaves files of 16384 bytes
# or less uncompressed (measured on macOS), so smaller files would only cost a copy.
min_size = 16385

# Files modified less than this many seconds ago are skipped (they may still be written to).
min_age_secs = 300

# Log directory; the log is <log_dir>/auto-compress-apfs.log.
log_dir = "~/Library/Logs/auto-compress-apfs"

# Rotate the current log when it would grow beyond this many bytes (>= 65536).
log_max_bytes = 4194304

# Rotated logs kept (.log.1 .. .log.N, at most 9).
# log_max_bytes * (log_keep + 1) + 1 MiB must not exceed 10 MiB.
log_keep = 1

# `trash` moves every file or directory matched by these patterns to ~/.Trash; `purge` deletes
# them for good. Same pattern and exclude syntax as above; a matched directory goes as a whole,
# whatever its age, unless an exclude matches something inside it (then it stays). Only items
# strictly below the home directory or an allow_volumes mount are acted on. Nothing happens without `--apply` (`trash --apply`,
# `purge --apply`); `scheduled = true` also runs the rule in `run`, which the launchd agent
# starts daily (order: trash, purge, compress). Every item is written to
# <log_dir>/removed.tsv. Hard protections apply as for compress, and an item is refused when it
# is the home directory, a protected folder itself, an ancestor of either, is the config file or
# one of the tool's files next to it, lies in or holds the log, state or cache directory or the
# Trash, or holds a flagged (uchg/schg/...), a
# dataless (cloud) or a .acz-staging-/.acz-rescue- entry. Excludes match the spelling of the
# path as walked (and the on-disk spelling below a matched item), case-sensitively.
[trash]
patterns = []
exclude = []
scheduled = false

[purge]
patterns = []
exclude = []
scheduled = false
